        el.textContent = "JS error: " + msg + " (line " + line + ")";

window.ABU_CFG = {

    SOCIAL: [

<script>
(function() {
    "use strict";

    const $ = selector => document.querySelector(selector);
    const $$ = selector => Array.from(document.querySelectorAll(selector));

    const storage = {
        get(key, fallback) {
            try {
                const item = localStorage.getItem("abuahmad_iptv_" + key);
                return item == null ? fallback : JSON.parse(item);
            } catch (e) {
                return fallback;
            }
        },
        set(key, val) {
            try {
                localStorage.setItem("abuahmad_iptv_" + key, JSON.stringify(val));
                return true;
            } catch (e) {
                return false;
            }
        }
    };

    const escapeHtml = str => String(str == null ? "" : str).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
    const isUrl = str => /^https?:\/\/[^\s]+$/i.test(String(str || "").trim());
    const panelUrl = String((window.ABU_CFG || {}).PANEL || "").trim().replace(/\/+$/, "");

    const typeNames = { live: "القنوات", movie: "الأفلام", series: "المسلات" };
    const typeIcons = { live: "📡", movie: "🎬", series: "🎞️" };
    const typeUnits = { live: "قناة", movie: "فيلم", series: "مسلسل" };

    let state = {
        rcv: [],
        custom: [],
        ri: 0,
        rx: null,
        mode: "",
        srcName: "",
        rErr: "",
        all: [],
        loaded: {},
        counts: {},
        type: "live",
        group: "__all",
        q: "",
        list: [],
        shown: 0,
        view: "start",
        series: null,
        searching: null,
        skipPop: false,
        fsPushed: false,
        fav: new Set(storage.get("fav", []))
    };

    let playerState = {
        open: false,
        cur: null,
        i: -1,
        hls: null,
        mp: null,
        dash: null,
        mode: "",
        alt: 0,
        wd: 0,
        hudT: 0,
        log: []
    };

    let creds = {};
    const isNative = !(!window.AbuNative || !window.AbuNative.play);

    function isStreamUrl(url) {
        if (!isUrl(url)) return false;
        let clean = String(url || "").split("?")[0].toLowerCase();
        return !(/\.(m3u8|ts|mpd|mp4|mkv|webm|m4v|aac|mp3)$/.test(clean) || /\/(live|movie|series|hls|manifest)\//.test(clean) || !/\.\w{2,4}$/.test(clean.split("/").pop() || ""));
    }

    function setBootMsg(msg, isErr) {
        const el = $("#msg");
        el.className = "msg" + (isErr ? " err" : "");
        el.textContent = msg;
    }

    function showToast(msg) {
        const toast = $("#toast");
        toast.textContent = msg;
        toast.classList.add("on");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => toast.classList.remove("on"), 2400);
    }

    function getInitials(name) {
        return (String(name).replace(/[^0-9A-Za-z\u0600-\u06FF ]/g, "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("") || "TV").toUpperCase();
    }

    function renderLogo(logoUrl, name) {
        if (isUrl(logoUrl)) {
            return `<img loading="lazy" src="${escapeHtml(logoUrl)}" alt="" data-fb="${escapeHtml(name)}">`;
        }
        return `<span class="ini">${escapeHtml(name)}</span>`;
    }

    async function fetchProxy(url, timeout) {
        if (panelUrl && !isNative && (location.protocol === 'https:' || url.startsWith('http:')) && !url.startsWith(panelUrl)) {
            url = panelUrl + "/m3u?url=" + encodeURIComponent(url);
        }
        if (isNative && isUrl(url) && url.indexOf(panelUrl) !== 0) {
            try {
                return await fetchRaw(panelUrl + "/__native?url=" + encodeURIComponent(url), timeout);
            } catch (e) {}
        }
        return fetchRaw(url, timeout);
    }

    async function fetchRaw(url, timeoutMs) {
        const controller = window.AbortController ? new AbortController() : null;
        const timer = controller && setTimeout(() => controller.abort(), timeoutMs || 30000);
        try {
            const resp = await fetch(url, { cache: "no-store", signal: controller && controller.signal });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            return await resp.text();
        } catch (e) {
            throw new Error(e.name === "AbortError" ? "انتهت مهلة الاتصال" : e.message);
        } finally {
            if (timer) clearTimeout(timer);
        }
    }

    async function fetchXtreamApi(action) {
        const targetUrl = creds.base + "/player_api.php?username=" + encodeURIComponent(creds.u) + "&password=" + encodeURIComponent(creds.p) + (action ? "&action=" + action : "");
        const respText = await fetchProxy(targetUrl, 60000);
        try {
            return JSON.parse(respText);
        } catch (e) {
            throw new Error("رد غير صالح من السيرفر");
        }
    }

    async function initApp() {
        $("#retry").classList.add("hide");
        setBootMsg("جاري التحميل…");
        try {
            if (!panelUrl) throw new Error("رابط لوحة التحكم غير مضبوط");
            const configText = await fetchProxy(panelUrl + "/config", 15000);
            const cfg = JSON.parse(configText);
            storage.set("panel", cfg);
            parseConfig(cfg);
        } catch (e) {
            const cached = storage.get("panel", null);
            if (cached) {
                showToast("تعذّر الاتصال باللوحة، تم استخدام آخر إعدادات");
                parseConfig(cached);
            } else {
                setBootMsg("تعذّر الاتصال بلوحة التحكم (" + e.message + "). تأكد من الإنترنت وحاول مرة أخرى.", true);
                $("#retry").classList.remove("hide");
                return;
            }
        }

        if (!state.rcv.length && !state.custom.length) {
            setBootMsg("لا توجد رسيفرات بعد. أضفها من لوحة التحكم ثم اضغط إعادة المحاولة.", true);
            $("#retry").classList.remove("hide");
            return;
        }

        let rcvIndex = +storage.get("rcv", 0) || 0;
        if (rcvIndex < 0 || rcvIndex >= state.rcv.length) rcvIndex = 0;
        await loadReceiver(rcvIndex);
    }

    function parseConfig(cfg) {
        const rcvList = [];
        ((cfg || {}).xtream || []).forEach(x => {
            if (x && isUrl(x.server) && x.username && x.password) {
                rcvList.push({
                    k: "xt",
                    name: x.name,
                    server: String(x.server).trim().replace(/\/+$/, ""),
                    username: String(x.username).trim(),
                    password: String(x.password).trim()
                });
            }
        });

        ((cfg || {}).m3u || []).concat(cfg.files || []).forEach(m => {
            if (!m || !isUrl(m.url)) return;
            const u = String(m.url).trim();
            rcvList.push({ k: "m3u", name: m.name, url: u });
        });

        rcvList.forEach((r, idx) => r.name = String(r.name || "").trim() || ("رسيفر " + (idx + 1)));
        state.rcv = rcvList;
        renderHome();
    }

    async function loadReceiver(index) {
        const rcv = state.rcv[index];
        state.ri = index;
        storage.set("rcv", index);
        state.rx = rcv || null;
        state.mode = rcv ? rcv.k : "";
        state.srcName = rcv ? rcv.name : "";

        if (rcv && rcv.k === "xt") {
            creds = { base: rcv.server, u: rcv.username, p: rcv.password };
            try {
                const info = await fetchXtreamApi("");
                if (!info || !info.user_info || info.user_info.auth !== 1) {
                    throw new Error("بيانات الاشتراك غير صحيحة");
                }
            } catch (e) {
                state.rErr = e.message;
            }
        }
        renderHome();
        $("#boot").classList.add("hide");
        $("#app").classList.remove("hide");
    }

    function renderHome() {
        $("#app").classList.remove("hide");
        $("#grid").innerHTML = `<div class="empty">تم تجهيز التطبيق بنجاح.</div>`;
    }

    document.addEventListener("DOMContentLoaded", () => {
        $("#retry").onclick = initApp;
        initApp();
    });
})();
</script>
