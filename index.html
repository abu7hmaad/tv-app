<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1320">
<title>تلفزيون أبو أحمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root {
    --ink: #0a1320;
    --panel: #101c2d;
    --raise: #172840;
    --line: #233650;
    --gold: #f0b94a;
    --cyan: #3fd3e6;
    --text: #e8eef7;
    --mute: #8798b0;
    --bad: #ff6b6b;
    --r: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; max-width: 100%; overflow-x: hidden; }
body { background: var(--ink); color: var(--text); font-family: 'Cairo', Tahoma, Arial, sans-serif; overflow-y: auto; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
.fx { outline: none; transition: transform .15s, box-shadow .15s; }
.fx:hover { transform: scale(1.02); }
.hide { display: none !important; }
.btn { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; color: var(--text); }
.btn.pri { background: var(--gold); color: #1a1204; border-color: var(--gold); }
#boot { position: fixed; inset: 0; z-index: 9990; background: var(--ink); display: grid; place-items: center; padding: 24px; }
.box { width: min(560px,100%); text-align: center; }
.brand { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 22px; }
.brand .mk { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(140deg,var(--gold),#c98a1c); display: grid; place-items: center; color: #1a1204; font-weight: 900; font-size: 26px; }
.brand h1 { font-size: 28px; font-weight: 900; }
.msg { padding: 12px 14px; border-radius: 12px; font-size: 14px; background: rgba(63,211,230,.08); border: 1px solid rgba(63,211,230,.35); color: #bff4fa; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 100; }
header .mk { width: 38px; height: 38px; border-radius: 11px; background: var(--gold); color: #1a1204; font-weight: 900; display: grid; place-items: center; flex: none; }
header h2 { font-size: 16px; font-weight: 900; }
#rname { color: var(--cyan); font-size: 12px; font-weight: 700; }
.sp { flex: 1; }
.ib { width: 40px; height: 40px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.ib svg { width: 20px; height: 20px; stroke: currentColor; }
#wrap { padding: 16px; max-width: 1200px; margin: 0 auto; }
.sec { display: flex; align-items: center; gap: 10px; margin: 16px 0; font-weight: 900; font-size: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.tile { position: relative; overflow: hidden; border-radius: 20px; padding: 20px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; text-align: right; color: #fff; background: linear-gradient(150deg,var(--a),var(--b)); border: 1px solid rgba(255,255,255,.1); cursor: pointer; user-select: none; }
.tile b { font-size: 20px; font-weight: 900; }
.tile small { font-size: 13px; opacity: .85; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
.gcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-align: right; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.gcard:hover { border-color: var(--gold); }
.gcard b { font-size: 14px; font-weight: 800; line-height: 1.4; color: var(--text); }
.gcard small { color: var(--cyan); font-size: 12px; }
#player-container { margin-bottom: 20px; background: #000; border-radius: 16px; overflow: hidden; display: none; }
video { width: 100%; aspect-ratio: 16/9; display: block; }
</style>
</head>
<body>

<section id="boot">
  <div class="box">
    <div class="brand"><div class="mk">أ</div><div><h1>تلفزيون أبو أحمد</h1></div></div>
    <div id="msg" class="msg">جاري تحميل البيانات…</div>
  </div>
</section>

<section id="app" class="hide">
  <header>
    <div class="mk">أ</div>
    <div>
        <h2>تلفزيون أبو أحمد</h2>
        <small id="rname"></small>
    </div>
    <span class="sp"></span>
    <button class="btn hide" id="backBtn">↩ الرجوع</button>
    <button class="ib fx" id="reloadBtn" title="تحديث"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </header>

  <div id="wrap">
    <div id="player-container">
        <video id="vid" controls autoplay></video>
    </div>
    <div id="main-content"></div>
  </div>
</section>

<script>
window.ABU_CFG = { PANEL: 'https://abuahmad-receiver.abu7hmaad.workers.dev' };

(function() {
    "use strict";

    const $ = s => document.querySelector(s);
    let state = { rcv: [], curRx: null, mode: 'home', categories: [], streams: [] };
    let hlsPlayer = null;

    async function init() {
        try {
            const res = await fetch(window.ABU_CFG.PANEL);
            const data = await res.json();
            state.rcv = data.xtream || [];
            if (state.rcv.length) {
                state.curRx = state.rcv[0];
                $("#rname").textContent = "📡 " + state.curRx.name;
                renderHome();
                $("#boot").classList.add("hide");
                $("#app").classList.remove("hide");
            } else {
                $("#msg").textContent = "⚠️ لا توجد بيانات رسيفرات صحيحة.";
            }
        } catch (e) {
            $("#msg").textContent = "تعذّر جلب البيانات: " + e.message;
        }
    }

    function renderHome() {
        state.mode = 'home';
        $("#backBtn").classList.add("hide");
        $("#main-content").innerHTML = `
            <div class="sec">📺 المحتوى المتاح في ${state.curRx.name}</div>
            <div class="tiles">
                <div class="tile fx" data-type="live" style="--a:#103b68; --b:#0c2544;">
                    <b>📡 القنوات المباشرة</b>
                    <small>عرض الأقسام والباقات</small>
                </div>
                <div class="tile fx" data-type="movie" style="--a:#68103b; --b:#440c25;">
                    <b>🎬 مكتبة الأفلام</b>
                    <small>أحدث الأفلام المترجمة</small>
                </div>
                <div class="tile fx" data-type="series" style="--a:#106841; --b:#0c442b;">
                    <b>🎞️ المسلسلات</b>
                    <small>المواسم والحلقات</small>
                </div>
            </div>
        `;

        document.querySelectorAll('.tile').forEach(el => {
            el.onclick = () => loadCategories(el.dataset.type);
        });
    }

    async function loadCategories(type) {
        $("#main-content").innerHTML = `<div class="sec">جاري تحميل الأقسام...</div>`;
        const action = type === 'live' ? 'get_live_categories' : type === 'movie' ? 'get_vod_categories' : 'get_series_categories';
        const url = `${state.curRx.server}/player_api.php?username=${state.curRx.username}&password=${state.curRx.password}&action=${action}`;

        try {
            const res = await fetch(url);
            const cats = await res.json();
            state.categories = cats;
            renderCategories(type);
        } catch (e) {
            $("#main-content").innerHTML = `<div class="sec">تعذّر جلب الأقسام</div>`;
        }
    }

    function renderCategories(type) {
        state.mode = 'cats';
        $("#backBtn").classList.remove("hide");
        let html = `<div class="sec">📂 الأقسام المتاحة</div><div class="grid">`;
        state.categories.forEach(c => {
            html += `<div class="gcard fx" data-id="${c.category_id}" data-type="${type}">
                <b>${c.category_name}</b>
                <small>اضغط لفتح القنوات</small>
            </div>`;
        });
        html += `</div>`;
        $("#main-content").innerHTML = html;

        document.querySelectorAll('.gcard').forEach(el => {
            el.onclick = () => loadStreams(el.dataset.type, el.dataset.id);
        });
    }

    async function loadStreams(type, catId) {
        $("#main-content").innerHTML = `<div class="sec">جاري جلب القائمة...</div>`;
        const action = type === 'live' ? 'get_live_streams' : type === 'movie' ? 'get_vod_streams' : 'get_series_streams';
        const url = `${state.curRx.server}/player_api.php?username=${state.curRx.username}&password=${state.curRx.password}&action=${action}&category_id=${catId}`;

        try {
            const res = await fetch(url);
            const streams = await res.json();
            renderStreams(streams, type);
        } catch (e) {
            $("#main-content").innerHTML = `<div class="sec">تعذّر تحميل القنوات</div>`;
        }
    }

    function renderStreams(streams, type) {
        state.mode = 'streams';
        let html = `<div class="sec">📺 القنوات والمحتوى</div><div class="grid">`;
        streams.forEach(s => {
            const streamId = s.stream_id || s.series_id;
            const ext = type === 'live' ? 'm3u8' : 'mp4';
            const playUrl = `${state.curRx.server}/${type}/${state.curRx.username}/${state.curRx.password}/${streamId}.${ext}`;
            html += `<div class="gcard fx play-btn" data-url="${playUrl}">
                <b>${s.name}</b>
                <small>▶ تشغيل الآن</small>
            </div>`;
        });
        html += `</div>`;
        $("#main-content").innerHTML = html;

        document.querySelectorAll('.play-btn').forEach(el => {
            el.onclick = () => playStream(el.dataset.url);
        });
    }

    function playStream(url) {
        const container = $("#player-container");
        const video = $("#vid");
        container.style.display = 'block';

        if (Hls.isSupported() && url.includes('m3u8')) {
            if (hlsPlayer) hlsPlayer.destroy();
            hlsPlayer = new Hls();
            hlsPlayer.loadSource(url);
            hlsPlayer.attachMedia(video);
        } else {
            video.src = url;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    $("#backBtn").onclick = () => {
        $("#player-container").style.display = 'none';
        if (state.mode === 'streams') {
            renderCategories('live');
        } else {
            renderHome();
        }
    };

    $("#reloadBtn").onclick = init;
    document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
