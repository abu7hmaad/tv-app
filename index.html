<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1320">
<title>تلفزيون أبو أحمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
<style>
:root{--ink:#0a1320;--panel:#101c2d;--raise:#172840;--line:#233650;--gold:#f0b94a;--cyan:#3fd3e6;--text:#e8eef7;--mute:#8798b0;--bad:#ff6b6b;--r:14px}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%;max-width:100%;overflow-x:hidden}body{background:var(--ink);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;overflow:hidden}
header { background: var(--panel); padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid var(--line); }
.main-container { display: flex; flex-direction: column; height: calc(100vh - 60px); }
.player-box { width: 100%; aspect-ratio: 16/9; background: #000; }
video { width: 100%; height: 100%; }
.channels-section { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.channel-item { background: var(--raise); border: 1px solid var(--line); padding: 15px; border-radius: var(--r); text-align: center; cursor: pointer; font-weight: 600; }
.channel-item:active { background: var(--gold); color: #000; }
@media (min-width: 768px) { .main-container { flex-direction: row; } .player-box { flex: 2; height: 100%; } .channels-section { flex: 1; } }
</style>
</head>
<body>

<header>📺 مشغل تلفزيون أبو أحمد المباشر</header>

<div class="main-container">
    <div class="player-box">
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>
    
    <div class="channels-section">
        <!-- 👇 أضف قنواتك هنا يا أبو أحمد بتكرار السطور بالأسفل واستبدال الروابط والأسماء 👇 -->
        <div class="channel-item" onclick="startPlay('https://mux.dev')">قناة تجريبية 1</div>
        <div class="channel-item" onclick="startPlay('https://cloudfront.net')">قناة تجريبية 2</div>
        
        <!-- يمكنك إضافة سطر جديد هنا لقناتك الخاصة بهذا الشكل: -->
        <!-- <div class="channel-item" onclick="startPlay('ضع رابط القناة هنا.m3u8')">اسم القناة الخاصة بك</div> -->
    </div>
</div>

<script>
// تفعيل الـ PWA ليعمل التطبيق في الخلفية على الآيفون
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
}

let activeHls = null;
function startPlay(url) {
    const video = document.getElementById('videoPlayer');
    if (activeHls) { activeHls.destroy(); }

    if (Hls.isSupported()) {
        activeHls = new Hls();
        activeHls.loadSource(url);
        activeHls.attachMedia(video);
        activeHls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // التشغيل المباشر لمتصفح سفاري على الآيفون والماك
        video.src = url;
        video.addEventListener('loadedmetadata', function() { video.play(); });
    }
}

// تشغيل القناة الأولى تلقائياً عند فتح الموقع
window.addEventListener('DOMContentLoaded', () => {
    const firstChan = document.querySelector('.channel-item');
    if (firstChan) { firstChan.click(); }
});
</script>
</body>
</html>
